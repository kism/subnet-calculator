<!doctype html>
<html lang="en">
  <!-- %VITE_SOURCE% -->
  <head>
    <meta charset="utf-8" />
    <title>Subnet calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Clacks-Overhead" content="GNU Terry Pratchett" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <fieldset>
        <legend>Subnet calculator</legend>
        <div id="addr">
          <label>IP address <input id="ip" placeholder="192.168.1.10/24" spellcheck="false" /></label>
          <label class="box" id="mask-box">
            Netmask <input id="mask" placeholder="255.255.255.0" size="15" spellcheck="false" />
          </label>
        </div>
        <label class="box" id="prefix-box">
          Prefix <output id="prefix-out">/24</output>
          <span id="slider">
            <input type="range" id="prefix" min="0" max="32" value="24" />
            <span style="--p: 0">0</span><span style="--p: 8">8</span><span style="--p: 16">16</span><span style="--p: 24">24</span
            ><span style="--p: 32">32</span>
          </span>
        </label>
      </fieldset>
      <table id="info"></table>
    </main>
    <div id="zoom">
      <button type="button" id="smaller">A-</button>
      <button type="button" id="reset">A</button>
      <button type="button" id="bigger">A+</button>
    </div>
  </body>
</html>
