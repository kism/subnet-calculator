<!doctype html>
<html lang="en">
  <!-- %VITE_SOURCE% -->
  <head>
    <meta charset="utf-8" />
    <title>Subnet calculator</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Clacks-Overhead" content="GNU Terry Pratchett" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="desktop">
    <main class="window" tabindex="-1">
      <div class="title-bar"><div class="title-bar-text">Subnet calculator</div></div>
      <div class="window-body">
        <div id="addr">
          <label>IPv4 <input id="ip" placeholder="192.168.1.10/24" autocomplete="off" spellcheck="false" /></label>
          <label class="box">
            Netmask <input id="mask" placeholder="255.255.255.0" size="15" spellcheck="false" />
          </label>
        </div>
        <label class="box" id="prefix-box">
          Prefix <output id="prefix-out">/24</output>
          <span id="slider">
            <input type="range" id="prefix" min="0" max="32" value="24" />
            <span style="--p: 0">0</span><span style="--p: 8">8</span><span style="--p: 16">16</span><span style="--p: 24">24</span
            ><span style="--p: 32">32</span>
          </span>
        </label>
        <div id="info" class="raised"></div>
      </div>
    </main>
    <div id="controls" class="window" tabindex="-1">
      <div class="title-bar"><div class="title-bar-text">Settings</div></div>
      <div class="window-body">
        <div>
          <div id="zoom">
            <button type="button" id="smaller">A-</button>
            <button type="button" id="reset">A</button>
            <button type="button" id="bigger">A+</button>
          </div>
          <div>
            <button type="button" id="prev-font">&lt;</button>
            <button type="button" id="font"></button>
            <button type="button" id="next-font">&gt;</button>
          </div>
          <div>
            <button type="button" id="prev-skin">&lt;</button>
            <button type="button" id="skin"></button>
            <button type="button" id="next-skin">&gt;</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
